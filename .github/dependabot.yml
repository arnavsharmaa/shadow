version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The ESLint stack moves together: a new ESLint major needs matching
      # @eslint/js, typescript-eslint and globals releases.
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "globals", "eslint-*"]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the Node.js line in .nvmrc; bump it with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "ci"
  # Base images track the Node.js LTS line in .nvmrc; major bumps are manual.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    labels: ["type:chore", "area:ci"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    labels: ["type:chore", "area:ci"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
