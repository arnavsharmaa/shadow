version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    labels: ["type:chore", "area:ci"]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    labels: ["type:chore", "area:ci"]
